<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificado · ILFIS</title>
<!--
  Certificado ILFIS (UBUNTU) — réplica fiel del diseño Laravel (verdiploma).
  Destino del QR y visor/descarga del certificado. Se abre como:
      /certificado/?c=CODIGO
  Pide los datos a  /api/cursos/certificados/ver/{codigo}  (público).
  Para previsualizar el diseño sin backend:  /certificado/?demo=1
-->
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#e9edf3; font-family:"Segoe UI",Roboto,Arial,sans-serif; color:#123; }

  /* Barra superior (no se imprime) */
  .barra{ display:flex; gap:12px; justify-content:center; align-items:center;
          padding:14px; flex-wrap:wrap; }
  .estado{ font-size:.92rem; padding:7px 14px; border-radius:20px; font-weight:600; }
  .ok{ background:#e5f6e9; color:#1a7a37; } .mal{ background:#fdeaea; color:#b02020; }
  .btn{ padding:10px 20px; border:0; border-radius:8px; font-size:.95rem; cursor:pointer;
        background:#c0392b; color:#fff; font-weight:600; }
  .btn:hover{ background:#a5311f; }

  /* Lienzo del certificado — A4 horizontal (ratio del fondo 1920x1359) */
  .hoja{ position:relative; width:1180px; max-width:97vw; aspect-ratio:1920/1359;
         margin:0 auto 34px; background:#fff; box-shadow:0 10px 34px rgba(0,0,0,.20);
         overflow:hidden; container-type:inline-size; }
  .fondo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }

  /* Contenido sobre el fondo. Medidas en % (posición) y cqw/em (texto) → escala
     idéntico en cualquier ancho de pantalla. 1cqw = 1% del ancho del certificado. */
  .cont{ position:absolute; inset:0; z-index:1;
         font-family:Arial, Helvetica, Verdana, sans-serif; color:#1a1a1a;
         font-size:1.35cqw; }
  .centro{ position:absolute; top:20.5%; left:6%; right:6%; text-align:center; }
  .titulo{ font-size:2.35em; font-weight:700; margin-bottom:.35em; }
  .intro{ font-size:1.2em; margin-bottom:.5em; }
  .nombre{ font-size:2.15em; font-weight:800; text-transform:uppercase; line-height:1.05;
           margin:.15em 0 .25em; }
  .accion{ font-size:1.2em; font-weight:400; margin-bottom:.35em; }
  .curso{ font-size:1.75em; font-weight:700; text-transform:capitalize; line-height:1.12;
          width:88%; margin:0 auto; }

  /* Zona inferior: detalles (izq) + firmas (centro/der) + QR (der) */
  .detalles{ position:absolute; left:8%; bottom:9%; font-size:1.15em; line-height:1.55;
             text-align:left; max-width:46%; }
  .firmas{ position:absolute; right:9%; bottom:11%; display:flex; gap:2.5em; align-items:flex-end; }
  .firma{ text-align:center; font-size:1.02em; width:11em; }
  .firma img{ display:block; margin:0 auto .1em; height:4.3em; max-width:100%; object-fit:contain; }
  .firma .ln{ border-top:1.5px solid #333; margin:.1em .4em .25em; }
  .firma b{ font-weight:700; }
  .qr{ position:absolute; right:8%; bottom:31%; width:8.2%; }
  .qr img{ width:100%; display:block; }

  .msg{ text-align:center; padding:70px 20px; color:#555; }
  .msg h2{ margin-bottom:8px; }

  @media print{
    @page{ size:A4 landscape; margin:0; }
    body{ background:#fff; }
    .barra{ display:none; }
    .hoja{ box-shadow:none; margin:0; width:100%; max-width:none; }
  }
</style>
</head>
<body>
  <div class="barra" id="barra" style="display:none;">
    <span class="estado" id="estado"></span>
    <button class="btn" onclick="window.print()">⬇ Descargar / Imprimir PDF</button>
  </div>

  <div id="root"><div class="msg">Cargando certificado…</div></div>

<script>
const API = "https://ilfis-ubuntu-27378911758.us-central1.run.app";
const ASSETS = "assets/";
const $ = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function param(k){ return (new URLSearchParams(location.search).get(k)||"").trim(); }

function pintarError(titulo, msg){
  $("root").innerHTML = `<div class="msg"><h2>${esc(titulo)}</h2><p>${esc(msg)}</p></div>`;
  $("barra").style.display = "none";
}

function pintar(d){
  const esParticipacion = (d.tipo === "participacion");
  // Bloque de detalles (izquierda)
  let det = "";
  if(!esParticipacion){
    det += `Obteniendo una calificación aprobatoria de: ${esc(d.calificacion)}/100<br>`;
    if(d.inicio) det += `Inicio: ${esc(d.inicio)}<br>`;
    if(d.culminacion) det += `Culminación: ${esc(d.culminacion)}<br>`;
    det += `Con un total de: ${esc(d.horas)} Horas<br>`;
  } else {
    if(d.realizado) det += `Realizado ${esc(d.realizado)}<br>`;
    det += `Con un total de ${esc(d.horas)} Horas Lectivas<br>`;
  }
  det += `Instructor: ${esc(d.instructor)}<br>`;
  det += `Fecha de emisión: ${esc(d.fecha)}`;

  const fondo = ASSETS + (d.fondo || "fondo-2025.png");
  const firmaSec = ASSETS + (d.firma_secretario || "firma-ilfis-guillermo-paredes.jpg");
  const firmaIns = ASSETS + (d.firma_instructor || "");
  const qrImg = d.qr ? `<div class="qr"><img src="${d.qr}" alt="QR de verificación"></div>` : "";

  $("root").innerHTML = `
    <div class="hoja">
      <img class="fondo" src="${fondo}" alt="">
      <div class="cont">
        <div class="centro">
          <div class="titulo">Certificado de ${esParticipacion ? "Participación" : "Aprobación"}</div>
          <div class="intro">El Instituto Latinoamericano de Formación en Incendios y Seguridad, certifica que:</div>
          <div class="nombre">${esc(d.nombre) || "—"}</div>
          <div class="accion">${esParticipacion ? "Participó del:" : "Aprobó satisfactoriamente el:"}</div>
          <div class="curso">${esc(d.curso) || ""}</div>
        </div>
        <div class="detalles">${det}</div>
        <div class="firmas">
          <div class="firma">
            <img src="${firmaSec}" alt="">
            <div class="ln"></div>
            <b>${esc(d.secretario_nombre || "Guillermo Paredes")}</b><br>${esc(d.secretario_cargo || "Secretario General")}
          </div>
          <div class="firma">
            ${firmaIns ? `<img src="${firmaIns}" alt="">` : `<div style="height:4.3em"></div>`}
            <div class="ln"></div>
            <b>${esc(d.instructor)}</b><br>Instructor
          </div>
        </div>
        ${qrImg}
      </div>
    </div>`;

  $("barra").style.display = "flex";
  $("estado").className = "estado ok";
  $("estado").textContent = "✓ Certificado auténtico · verificado por ILFIS";
  document.title = "Certificado · " + (d.nombre || d.codigo || "ILFIS");
}

async function cargar(){
  if(param("demo") === "1"){ pintar(DEMO); return; }
  const c = param("c");
  if(!c){ pintarError("Falta el código", "El enlace debe terminar en ?c=CÓDIGO"); return; }
  try{
    const r = await fetch(`${API}/api/cursos/certificados/ver/${encodeURIComponent(c)}`);
    const d = await r.json();
    if(!d.valido){
      if(d.anulado) pintarError("Certificado anulado", `El certificado "${c}" fue anulado y ya no es válido.`);
      else pintarError("Certificado no encontrado", `No existe un certificado con el código "${c}".`);
      return;
    }
    pintar(d);
  }catch(e){
    pintarError("No disponible", "No pude verificar el certificado ahora. Reintenta más tarde.");
  }
}

// Datos de muestra para previsualizar el diseño (?demo=1)
const DEMO = {
  valido:true, tipo:"aprobacion", codigo:"DEMO1",
  nombre:"Juan Carlos Pérez Rodríguez",
  curso:"Diplomado Internacional de Diseño, Instalación y Mantenimiento de Bombas Contra Incendios",
  calificacion:87, inicio:"Septiembre 2024", culminacion:"Enero 2025", horas:60,
  instructor:"Jussef Liban", fecha:"14 de julio de 2026",
  secretario_nombre:"Guillermo Paredes", secretario_cargo:"Secretario General",
  fondo:"fondo-2025.png", firma_secretario:"firma-ilfis-guillermo-paredes.jpg",
  firma_instructor:"firma-1-jussef-liban.jpg", qr:""
};
cargar();
</script>
</body>
</html>
