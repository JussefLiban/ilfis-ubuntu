<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificado · ILFIS</title>
<!--
  Certificado ILFIS (UBUNTU) — diseño aprobado por Jussef (14-jul-2026).
  Destino del QR y visor/descarga. Se abre como:  /certificado/?c=CODIGO
  Pide los datos a  /api/cursos/certificados/ver/{codigo}  (público).
  Previsualizar el diseño sin backend:  /certificado/?demo=1
-->
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#e9edf3; font-family:"Segoe UI",Roboto,Arial,sans-serif; color:#123; }

  .barra{ display:flex; gap:12px; justify-content:center; align-items:center; padding:14px; flex-wrap:wrap; }
  .estado{ font-size:.92rem; padding:7px 14px; border-radius:20px; font-weight:600; }
  .ok{ background:#e5f6e9; color:#1a7a37; } .mal{ background:#fdeaea; color:#b02020; }
  .btn{ padding:10px 20px; border:0; border-radius:8px; font-size:.95rem; cursor:pointer;
        background:#c0392b; color:#fff; font-weight:600; }
  .btn:hover{ background:#a5311f; }

  /* Lienzo A4 apaisado (ratio del fondo 1920x1359) */
  .hoja{ position:relative; width:1180px; max-width:97vw; aspect-ratio:1920/1359;
         margin:0 auto 34px; background:#fff; box-shadow:0 10px 34px rgba(0,0,0,.20);
         overflow:hidden; container-type:inline-size; }
  .fondo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }

  /* Contenido — medidas en % (posición) y em/cqw (texto) para escalar en cualquier ancho */
  .cont{ position:absolute; inset:0; z-index:1; color:#1a1a1a;
         font-family:Arial,Helvetica,sans-serif; font-size:1.32cqw; }
  .titulo{ position:absolute; top:21.5%; left:8%; right:8%; text-align:center; font-size:2.0em; font-weight:800; letter-spacing:.01em; }
  .intro{ position:absolute; top:29%; left:10%; right:10%; text-align:center; font-size:1.05em; }
  .nombre{ position:absolute; top:34.2%; left:8%; right:8%; text-align:center; font-size:1.6em; font-weight:700; color:#1a1a1a; }
  .accion{ position:absolute; top:39.8%; left:11%; font-size:1.05em; }
  .curso{ position:absolute; top:43.8%; left:12%; right:12%; text-align:center; font-size:1.35em; font-weight:700; line-height:1.25; }
  .detalles{ position:absolute; top:54.7%; left:11%; font-size:1.05em; line-height:1.7; color:#12233f; }
  .firmas{ position:absolute; left:21%; width:40%; top:74%; display:flex; justify-content:space-around; }
  .firma{ text-align:center; width:14em; font-size:1em; }
  .firma img{ display:block; margin:0 auto; height:4.2em; }
  .firma .n{ margin-top:.15em; }
  .f-sec img{ height:4.41em; }
  .f-inst{ position:relative; left:9cqw; }
  .f-inst img{ height:4.62em; }
  .qr{ position:absolute; top:71%; right:6.5%; width:14%; }
  .qr img{ width:100%; display:block; }

  .msg{ text-align:center; padding:70px 20px; color:#555; }
  .msg h2{ margin-bottom:8px; }

  @media print{
    @page{ size:A4 landscape; margin:0; }
    html,body{ margin:0; padding:0; background:#fff; height:100%; overflow:hidden; }
    .barra{ display:none; }
    .hoja{ box-shadow:none; margin:0 auto; width:auto; height:100vh; max-width:100%; }
  }
</style>
</head>
<body>
  <div class="barra" id="barra" style="display:none;">
    <span class="estado" id="estado"></span>
    <button class="btn" onclick="window.print()">⬇ Descargar / Imprimir PDF</button>
  </div>

  <div id="root"><div class="msg">Cargando certificado…</div></div>

<script>
const API = "https://ilfis-ubuntu-27378911758.us-central1.run.app";
const ASSETS = "assets/";
const $ = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function param(k){ return (new URLSearchParams(location.search).get(k)||"").trim(); }

// Mayúscula inicial de cada palabra, salvo palabras de 3 letras o menos (que quedan
// minúsculas). La primera palabra siempre va con mayúscula. Preserva siglas (NFPA).
function tituloCurso(s){
  const ps = String(s||"").trim().split(/\s+/);
  return ps.map((w,i) => {
    if(!w) return w;
    if(w.length <= 3 && i !== 0) return w.toLowerCase();
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(" ");
}

// Capitaliza el nombre del mes dentro de una fecha ("17 de abril de 2025" → "…Abril…").
const _MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function capMes(f){
  return String(f||"").replace(new RegExp("\\b("+_MESES.join("|")+")\\b","gi"),
    m => m.charAt(0).toUpperCase() + m.slice(1).toLowerCase());
}

// Catálogo (apodos cortos por curso) — para el nombre del archivo PDF.
let _catalogo = null;
async function cargarCatalogo(){
  if(_catalogo) return _catalogo;
  try{ _catalogo = await (await fetch("catalogo.json")).json(); }
  catch(e){ _catalogo = { cursos:[] }; }
  return _catalogo;
}
const _norm = s => String(s||"").toLowerCase().replace(/\s+/g," ").trim();
function aliasCurso(nombre){
  const n = _norm(nombre);
  const c = (_catalogo && _catalogo.cursos || []).find(x => _norm(x.nombre) === n);
  return c ? (c.alias || "") : "";
}

function pintarError(titulo, msg){
  $("root").innerHTML = `<div class="msg"><h2>${esc(titulo)}</h2><p>${esc(msg)}</p></div>`;
  $("barra").style.display = "none";
}

function pintar(d){
  const participacion = (d.tipo === "participacion");
  // Bloque de detalles (izquierda)
  let det = "";
  if(!participacion){
    det += `Obteniendo una calificación aprobatoria de: ${esc(d.calificacion)}/100<br>`;
    if(d.inicio && d.culminacion) det += `Periodo: ${esc(d.inicio)} - ${esc(d.culminacion)}<br>`;
    else if(d.inicio) det += `Inicio: ${esc(d.inicio)}<br>`;
    if(d.horas) det += `Con un total de: ${esc(d.horas)} Horas<br>`;
  } else {
    if(d.realizado) det += `Realizado ${esc(d.realizado)}<br>`;
    if(d.horas) det += `Con un total de ${esc(d.horas)} Horas Lectivas<br>`;
  }
  if(d.instructor) det += `Instructor: ${esc(d.instructor)}<br>`;
  det += `Fecha de Emisión: ${esc(capMes(d.fecha))}`;

  const fondo = ASSETS + (d.fondo || "fondo-2025.png");
  const firmaSec = ASSETS + (d.firma_secretario || "firma-ilfis-guillermo-paredes.jpg");
  const firmaIns = d.firma_instructor ? (ASSETS + d.firma_instructor) : "";
  const qrImg = d.qr ? `<div class="qr"><img src="${d.qr}" alt="QR de verificación"></div>` : "";

  $("root").innerHTML = `
    <div class="hoja">
      <img class="fondo" src="${fondo}" alt="">
      <div class="cont">
        <div class="titulo">CERTIFICADO DE ${participacion ? "PARTICIPACIÓN" : "APROBACIÓN"}</div>
        <div class="intro">El Instituto Latinoamericano de Formación en Incendios y Seguridad, certifica que el(la) alumno(a):</div>
        <div class="nombre">${esc(d.nombre) || "—"}</div>
        <div class="accion">${participacion ? "Participó del:" : "Aprobó satisfactoriamente el curso:"}</div>
        <div class="curso">${esc(tituloCurso(d.curso))}</div>
        <div class="detalles">${det}</div>
        <div class="firmas">
          <div class="firma f-sec">
            <img src="${firmaSec}" alt="">
            <div class="n"><b>${esc(d.secretario_nombre || "Guillermo Paredes")}</b><br>${esc(d.secretario_cargo || "Secretario General")}</div>
          </div>
          <div class="firma f-inst">
            ${firmaIns ? `<img src="${firmaIns}" alt="">` : `<div style="height:4.62em"></div>`}
            <div class="n"><b>${esc(d.instructor)}</b><br>Instructor</div>
          </div>
        </div>
        ${qrImg}
      </div>
    </div>`;

  $("barra").style.display = "flex";
  $("estado").className = "estado ok";
  $("estado").textContent = "✓ Certificado auténtico · verificado por ILFIS";
  // Nombre del archivo al descargar/imprimir: "Certificado {apodo} · {alumno}"
  const alias = aliasCurso(d.curso);
  document.title = "Certificado " + (alias ? alias + " " : "") + "· " + (d.nombre || d.codigo || "ILFIS");
}

async function cargar(){
  await cargarCatalogo();
  if(param("demo") === "1"){ pintar(DEMO); return; }
  const c = param("c");
  if(!c){ pintarError("Falta el código", "El enlace debe terminar en ?c=CÓDIGO"); return; }
  try{
    const r = await fetch(`${API}/api/cursos/certificados/ver/${encodeURIComponent(c)}`);
    const d = await r.json();
    if(!d.valido){
      if(d.anulado) pintarError("Certificado anulado", `El certificado "${c}" fue anulado y ya no es válido.`);
      else pintarError("Certificado no encontrado", `No existe un certificado con el código "${c}".`);
      return;
    }
    pintar(d);
  }catch(e){
    pintarError("No disponible", "No pude verificar el certificado ahora. Reintenta más tarde.");
  }
}

// Datos de muestra para previsualizar el diseño (?demo=1)
const DEMO = {
  valido:true, tipo:"aprobacion", codigo:"DEMO1",
  nombre:"Carolina Lerma Caicedo",
  curso:"Diplomado Especializado en Diseño e Instalación de Sistemas de Rociadores Automáticos Contra Incendios en base a la norma NFPA 13",
  calificacion:62, inicio:"Noviembre 2024", culminacion:"Abril 2025", horas:60,
  instructor:"Jussef Liban", fecha:"17 de Abril de 2025",
  secretario_nombre:"Guillermo Paredes", secretario_cargo:"Secretario General",
  fondo:"fondo-2025.png", firma_secretario:"firma-ilfis-guillermo-paredes.jpg",
  firma_instructor:"firma-1-jussef-liban.jpg", qr:""
};
cargar();
</script>
</body>
</html>
